# worker / mcp のイメージを Cloud Build でビルドする
#   gcloud builds submit --config cloudbuild.yaml \
#     --substitutions=_APP=worker,_IMAGE=asia-northeast1-docker.pkg.dev/PROJECT/synedge/worker .
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "--build-arg", "APP=${_APP}", "-t", "${_IMAGE}", "."]
images: ["${_IMAGE}"]
substitutions:
  _APP: worker
  _IMAGE: ""
